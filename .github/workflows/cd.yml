name: Gateway CD
run-name: CD ${{ inputs.version }}${{ inputs.latest && ' (latest)' || '' }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 0.1.0-rc.1 or 0.1.0"
        required: true
        type: string
      latest:
        description: "Mark as default version: tag GitHub Release as Latest"
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

concurrency:
  group: cd-${{ inputs.version }}
  cancel-in-progress: false

env:
  GO_VERSION: "1.23"

jobs:
  prepare-release:
    name: Prepare release context
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.prepare.outputs.version }}
      target_sha: ${{ steps.prepare.outputs.target_sha }}
      prerelease: ${{ steps.prepare.outputs.prerelease }}
      publish_latest: ${{ steps.prepare.outputs.publish_latest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate version and target ref
        id: prepare
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_LATEST: ${{ inputs.latest }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./.github/scripts/release/prepare-release.sh

      - name: Print release summary
        run: |
          {
            echo "## LobeHub Gateway Go Release"
            echo
            echo "- Version: \`${{ steps.prepare.outputs.version }}\`"
            echo "- Workflow ref: \`${{ github.ref_name }}\`"
            echo "- Target SHA: \`${{ steps.prepare.outputs.target_sha }}\`"
            echo "- Prerelease: \`${{ steps.prepare.outputs.prerelease }}\`"
            echo "- Latest: \`${{ steps.prepare.outputs.publish_latest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  build-binaries:
    name: Build binaries (${{ matrix.os }}/${{ matrix.arch }})
    needs: prepare-release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare-release.outputs.target_sha }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-build-${{ matrix.os }}-${{ matrix.arch }}-${{ hashFiles('**/go.mod') }}
          restore-keys: |
            ${{ runner.os }}-go-build-${{ matrix.os }}-${{ matrix.arch }}-

      - name: Download dependencies
        run: go mod download

      - name: Build unified binary
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          set -euo pipefail
          BINARY_NAME="gateway-${{ matrix.os }}-${{ matrix.arch }}"
          go build -trimpath -ldflags='-s -w' -o "dist/${BINARY_NAME}" ./cmd/gateway
          ls -al "dist/${BINARY_NAME}"

      - name: Build standalone agent gateway
        working-directory: ./agent-gateway-go
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          BINARY_NAME="agent-gateway-${{ matrix.os }}-${{ matrix.arch }}"
          go build -trimpath -ldflags='-s -w' -o "../dist/${BINARY_NAME}" ./cmd/agent-gateway-go

      - name: Build standalone device gateway
        working-directory: ./device-gateway-go
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          BINARY_NAME="device-gateway-${{ matrix.os }}-${{ matrix.arch }}"
          go build -trimpath -ldflags='-s -w' -o "../dist/${BINARY_NAME}" ./cmd/device-gateway-go

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  create-draft-release:
    name: Create tag and draft release
    needs:
      - prepare-release
      - build-binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare-release.outputs.target_sha }}

      - name: Create tag and draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
          TARGET_SHA: ${{ needs.prepare-release.outputs.target_sha }}
          PRERELEASE: ${{ needs.prepare-release.outputs.prerelease }}
        run: ./.github/scripts/release/create-draft-release.sh

  upload-release-assets:
    name: Upload assets to release
    needs:
      - prepare-release
      - create-draft-release
    runs-on: ubuntu-latest
    steps:
      - name: Download all binary artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          path: dist
          merge-multiple: true

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          set -euo pipefail
          ls -al dist/
          gh release upload "$VERSION" dist/* --clobber

  build-docker:
    name: Build Docker image (${{ matrix.arch }})
    needs:
      - prepare-release
      - build-binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch:
          - amd64
          - arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare-release.outputs.target_sha }}

      - name: Download binary artifact
        uses: actions/download-artifact@v4
        with:
          name: binaries-linux-${{ matrix.arch }}
          path: .

      - name: Determine registry and image
        id: registry
        env:
          DOCKER_IMAGE: ${{ secrets.DOCKER_IMAGE }}
        run: |
          set -euo pipefail
          if [[ -n "$DOCKER_IMAGE" ]]; then
            IMAGE="$DOCKER_IMAGE"
            if [[ "$IMAGE" == */* ]]; then
              REGISTRY="${IMAGE%%/*}"
              if [[ ! "$REGISTRY" =~ \. ]] && [[ ! "$REGISTRY" =~ : ]]; then
                REGISTRY="docker.io"
              fi
            else
              REGISTRY="docker.io"
            fi
          else
            IMAGE="ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
            REGISTRY="ghcr.io"
          fi
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "registry=$REGISTRY" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.registry.outputs.registry }}
          username: ${{ secrets.DOCKER_USERNAME || github.actor }}
          password: ${{ secrets.DOCKER_PASSWORD || secrets.GITHUB_TOKEN }}

      - name: Build and push arch-specific image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          build-args: |
            BINARY_FILE=gateway-linux-${{ matrix.arch }}
          tags: ${{ steps.registry.outputs.image }}:${{ needs.prepare-release.outputs.version }}-${{ matrix.arch }}

  merge-docker:
    name: Merge Docker multi-arch manifest
    needs:
      - prepare-release
      - build-docker
    runs-on: ubuntu-latest
    steps:
      - name: Determine registry and image
        id: registry
        env:
          DOCKER_IMAGE: ${{ secrets.DOCKER_IMAGE }}
        run: |
          set -euo pipefail
          if [[ -n "$DOCKER_IMAGE" ]]; then
            IMAGE="$DOCKER_IMAGE"
            if [[ "$IMAGE" == */* ]]; then
              REGISTRY="${IMAGE%%/*}"
              if [[ ! "$REGISTRY" =~ \. ]] && [[ ! "$REGISTRY" =~ : ]]; then
                REGISTRY="docker.io"
              fi
            else
              REGISTRY="docker.io"
            fi
          else
            IMAGE="ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
            REGISTRY="ghcr.io"
          fi
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "registry=$REGISTRY" >> "$GITHUB_OUTPUT"

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.registry.outputs.registry }}
          username: ${{ secrets.DOCKER_USERNAME || github.actor }}
          password: ${{ secrets.DOCKER_PASSWORD || secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        env:
          IMAGE: ${{ steps.registry.outputs.image }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
          PUBLISH_LATEST: ${{ needs.prepare-release.outputs.publish_latest }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            -t "$IMAGE:$VERSION" \
            "$IMAGE:$VERSION-amd64" \
            "$IMAGE:$VERSION-arm64"
          if [[ "$PUBLISH_LATEST" == "true" ]]; then
            docker buildx imagetools create \
              -t "$IMAGE:latest" \
              "$IMAGE:$VERSION-amd64" \
              "$IMAGE:$VERSION-arm64"
          fi

  publish-release:
    name: Publish release
    needs:
      - prepare-release
      - upload-release-assets
      - merge-docker
    runs-on: ubuntu-latest
    steps:
      - name: Set release to published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
          PUBLISH_LATEST: ${{ needs.prepare-release.outputs.publish_latest }}
        run: |
          set -euo pipefail
          case "$PUBLISH_LATEST" in
            true | false) ;;
            *)
              echo "::error::PUBLISH_LATEST must be true or false, got $PUBLISH_LATEST"
              exit 1
              ;;
          esac
          RELEASE_ID="$(gh release view "$VERSION" --json databaseId --jq .databaseId)"
          gh api --method PATCH "repos/{owner}/{repo}/releases/$RELEASE_ID" \
            -F draft=false \
            -F "make_latest=$PUBLISH_LATEST" \
            --silent
