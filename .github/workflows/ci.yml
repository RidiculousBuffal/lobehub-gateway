name: Gateway CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.23"

jobs:
  check-unified:
    name: Check unified binary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-unified-${{ hashFiles('**/go.mod') }}
          restore-keys: |
            ${{ runner.os }}-go-unified-

      - name: Download dependencies
        run: go mod download

      - name: Build unified binary
        run: go build -trimpath -ldflags='-s -w' ./cmd/gateway

      - name: Test sub-modules
        run: go test ./agent-gateway-go/... ./device-gateway-go/...

  check-agent-gateway:
    name: Check agent gateway (agent-gateway-go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./agent-gateway-go
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-agent-${{ hashFiles('agent-gateway-go/go.mod') }}
          restore-keys: |
            ${{ runner.os }}-go-agent-

      - name: Build
        run: go build -trimpath -ldflags='-s -w' ./cmd/agent-gateway-go

      - name: Test
        run: go test ./...

  check-device-gateway:
    name: Check device gateway (device-gateway-go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./device-gateway-go
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-device-${{ hashFiles('device-gateway-go/go.mod') }}
          restore-keys: |
            ${{ runner.os }}-go-device-

      - name: Build
        run: go build -trimpath -ldflags='-s -w' ./cmd/device-gateway-go

      - name: Test
        run: go test ./...
