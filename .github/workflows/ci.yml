name: Gateway CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.23"

jobs:
  check-unified:
    name: 检查统一二进制 (unified)
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 设置 Go 环境
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: 缓存 Go 构建缓存
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-unified-${{ hashFiles('**/go.mod') }}
          restore-keys: |
            ${{ runner.os }}-go-unified-

      - name: 下载依赖
        run: go mod download

      - name: 编译统一二进制
        run: go build -trimpath -ldflags='-s -w' ./cmd/gateway

      - name: 测试子模块
        run: go test ./agent-gateway-go/... ./device-gateway-go/...

  check-agent-gateway:
    name: 检查 Agent 网关 (agent-gateway-go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./agent-gateway-go
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 设置 Go 环境
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: 缓存 Go 构建缓存
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-agent-${{ hashFiles('agent-gateway-go/go.mod') }}
          restore-keys: |
            ${{ runner.os }}-go-agent-

      - name: 编译
        run: go build -trimpath -ldflags='-s -w' ./cmd/agent-gateway-go

      - name: 单元测试
        run: go test ./...

  check-device-gateway:
    name: 检查 Device 网关 (device-gateway-go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./device-gateway-go
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 设置 Go 环境
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: 缓存 Go 构建缓存
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-device-${{ hashFiles('device-gateway-go/go.mod') }}
          restore-keys: |
            ${{ runner.os }}-go-device-

      - name: 编译
        run: go build -trimpath -ldflags='-s -w' ./cmd/device-gateway-go

      - name: 单元测试
        run: go test ./...
